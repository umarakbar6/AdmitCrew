name: Repository security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan current source for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan tracked source with redacted findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/tracked-source" "$RUNNER_TEMP/no-ignores"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/tracked-source" --config .gitleaks.toml --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores" --ignore-gitleaks-allow --redact=100 --no-banner --max-archive-depth 2
  quality:
    name: Dependency audit and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=low
      - run: node --test scripts/security.test.mjs
      - run: npm run typecheck
      - run: npm run test:acceptance
      - run: npm run build
